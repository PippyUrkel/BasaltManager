name: Android Release

on: 
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Install deps 
        run: flutter pub get
      
      - name: Verify flutter
        run: flutter doctor -v
      
      - name: Analyze project
        run: flutter analyze
      
      - name: Build Release apk
        run: flutter run build apk --release
      
      - name: Rename apk
        run: |
          mv build/app/outputs/flutter-apk/apk-release.apk Basalt-${{github.ref_name}}.apk

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Basalt-${{github.ref_name}}.apk